name: CI/CD Quality and Security Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-verify:
    name: Build, Lint, and Security Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Code Quality (Linter)
        run: npm run lint

      - name: Check Dependencies Security (Audit)
        run: npm audit

      - name: Compile and Bundle Production Build
        run: npm run build
